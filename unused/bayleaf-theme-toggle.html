<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bay Leaf theme toggle (original, unused)</title>
<!-- Saved exactly as provided for the Bay Leaf site. Not used by Verba; Verba uses an adapted copy. -->
<script>
/* Light by default for everyone; a visitor's own choice is remembered on their device. */
(function(){var t="light";try{if(localStorage.getItem("bayleaf-theme")==="dark")t="dark";}catch(e){}
document.documentElement.setAttribute("data-theme",t);})();
</script>
<style>
:root{
  --bg:#EEF2E4; --surface:#FBFCF6; --ink:#16261E; --brand:#1F4A36;
  --muted:#4F6B42; --rule:#CBD6BB; --accent:#D99A1E;
  /* easings from Open Props (open-props.style) */
  --ease-3:cubic-bezier(.25,0,.3,1); --ease-out-5:cubic-bezier(0,0,0,1);
  --ease-elastic-3:cubic-bezier(.5,1.25,.75,1.25); --ease-elastic-4:cubic-bezier(.5,1.5,.75,1.25);
}
:root[data-theme="dark"]{
  --bg:#0F241B; --surface:#173326; --ink:#EEF2E4; --brand:#B9D6A6;
  --muted:#9DB38D; --rule:#2C4A3A; --accent:#E9B341;
}
body{background:var(--bg);color:var(--ink)}

/* Theme switch: Adam Argyle, "Building a theme switch component", web.dev (Apache 2.0).
   Sun icon from Feather Icons. */
.theme-toggle{--size:2rem;--icon-fill:var(--brand);--icon-fill-hover:var(--ink);background:none;border:none;padding:0;inline-size:var(--size);block-size:var(--size);aspect-ratio:1;border-radius:50%;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline-offset:5px}
.theme-toggle>svg{inline-size:100%;block-size:100%;stroke-linecap:round}
@media (hover:none){.theme-toggle{--size:48px}}
.sun-and-moon>:is(.moon,.sun,.sun-beams){transform-origin:center center}
.sun-and-moon>:is(.moon,.sun){fill:var(--icon-fill)}
.theme-toggle:is(:hover,:focus-visible)>.sun-and-moon>:is(.moon,.sun){fill:var(--icon-fill-hover)}
.sun-and-moon>.sun-beams{stroke:var(--icon-fill);stroke-width:2px}
.theme-toggle:is(:hover,:focus-visible) .sun-and-moon>.sun-beams{stroke:var(--icon-fill-hover)}
[data-theme="dark"] .sun-and-moon>.sun{transform:scale(1.75)}
[data-theme="dark"] .sun-and-moon>.sun-beams{opacity:0}
[data-theme="dark"] .sun-and-moon>.moon>circle{transform:translateX(-7px)}
@supports (cx:1px){[data-theme="dark"] .sun-and-moon>.moon>circle{transform:translateX(0);cx:17px}}
@media (prefers-reduced-motion:no-preference){
  .sun-and-moon>.sun{transition:transform .5s var(--ease-elastic-3)}
  .sun-and-moon>.sun-beams{transition:transform .5s var(--ease-elastic-4),opacity .5s var(--ease-3)}
  .sun-and-moon .moon>circle{transition:transform .25s var(--ease-out-5)}
  @supports (cx:1px){.sun-and-moon .moon>circle{transition:cx .25s var(--ease-out-5)}}
  [data-theme="dark"] .sun-and-moon>.sun{transition-timing-function:var(--ease-3);transition-duration:.25s}
  [data-theme="dark"] .sun-and-moon>.sun-beams{transform:rotateZ(-25deg);transition-duration:.15s}
  [data-theme="dark"] .sun-and-moon>.moon>circle{transition-delay:.25s;transition-duration:.5s}
}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="light" aria-live="polite">
  <svg class="sun-and-moon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
    <mask class="moon" id="moon-mask">
      <rect x="0" y="0" width="100%" height="100%" fill="white" />
      <circle cx="24" cy="10" r="6" fill="black" />
    </mask>
    <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor" />
    <g class="sun-beams" stroke="currentColor">
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </g>
  </svg>
</button>
<script>
(function(){
  var root=document.documentElement, tt=document.getElementById("theme-toggle");
  tt.setAttribute("aria-label",root.getAttribute("data-theme")==="dark"?"dark":"light");
  tt.addEventListener("click",function(){
    var next=root.getAttribute("data-theme")==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);tt.setAttribute("aria-label",next);
    try{localStorage.setItem("bayleaf-theme",next);}catch(e){}
  });
})();
</script>
</body>
</html>
